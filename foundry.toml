[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts@5.1.0/=lib/openzeppelin-contracts/contracts/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false